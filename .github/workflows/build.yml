name: build apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepara APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/itag-guard-b${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk-b${{ github.run_number }}
          path: out/*.apk

      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: b${{ github.run_number }}
          name: build ${{ github.run_number }}
          files: out/*.apk
          make_latest: true
